# Development / test stack for Codespaces. Not used in production (see deploy/).
# The app container uses the stock devcontainers PHP image; PHP extensions, Chromium and the
# ephemeris engine are installed by setup.sh, so a failing package never blocks the codespace.
services:
  app:
    image: mcr.microsoft.com/devcontainers/php:1-8.4-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      XDEBUG_MODE: "off"
    depends_on:
      - db
      - mailpit

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: arj-dev-root
      MARIADB_DATABASE: arj
      MARIADB_USER: arj
      MARIADB_PASSWORD: arj-dev-password
    volumes:
      - db-data:/var/lib/mysql
      - ./db-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped

volumes:
  db-data:
