# VPS stack. Usage (from repository root):
#   cp deploy/.env.production.example deploy/.env.production   # fill in, keep private
#   docker compose -f deploy/docker-compose.yml up -d --build
# Caddy obtains and renews TLS certificates automatically for $DOMAIN.
name: arj

x-app: &app
  build: { context: .., dockerfile: deploy/Dockerfile }
  image: arj-app:latest
  env_file: .env.production
  restart: unless-stopped
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }
  volumes:
    - storage:/var/www/backend/storage

services:
  app:
    <<: *app
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 30s
      retries: 3

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=10,60,300", "--max-time=3600"]

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-astrorajnathjha.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - public:/srv/public:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

  db:
    image: mariadb:11.4
    restart: unless-stopped
    env_file: .env.production
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-arj}
      MARIADB_USER: ${DB_USERNAME:-arj}
      MARIADB_AUTO_UPGRADE: "1"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00", "--transaction-isolation=READ-COMMITTED"]
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis:/data]

  # Copies built public assets into a volume Caddy can serve directly.
  public-sync:
    <<: *app
    restart: "no"
    user: root
    command: ["sh", "-c", "cp -a /var/www/backend/public/. /srv/public/"]
    volumes:
      - public:/srv/public

volumes: { db: {}, redis: {}, storage: {}, public: {}, caddy_data: {}, caddy_config: {} }
