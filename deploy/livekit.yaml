# LiveKit server for in-app consultation calls. Keys come from LIVEKIT_KEYS (docker-compose).
port: 7880
bind_addresses: ["127.0.0.1"]   # signalling only via Caddy (rtc.<domain>)
rtc:
  tcp_port: 7881                 # media fallback when UDP is blocked
  udp_port: 7882                 # single multiplexed UDP port for media
  use_external_ip: true
room:
  empty_timeout: 300
  max_participants: 4
logging:
  level: info
# Optional: built-in TURN for networks that block UDP (needs turn.<domain> DNS + certificate).
# turn:
#   enabled: true
#   domain: turn.astrorajnathjha.com
